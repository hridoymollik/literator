<h2>Word Analyzer Tool</h2>

<textarea id="inputText" placeholder="Write your text here..."></textarea>

<br>

<button onclick="analyze()">Analyze</button>

<div id="output"></div>

<script>
// stop words
const stopWords = new Set([
 "a","an","the","is","am","are","was","were","be","been","being",
 "of","to","in","on","at","for","with","by","about","as",
 "under","over","into","from","that","this","these","those",
 "where","one","or","and","but","if","so","because",
 "have","has","had","do","does","did","makes","make"
]);

// pronouns to remove from common words
const pronouns = new Set([
 "i","you","he","she","it","we","they","me","him","her","us","them",
 "my","your","his","her","its","our","their",
 "mine","yours","hers","ours","theirs",
  
  "s","not","also","point","link",
 "poem","writer","writers","poems","poets","only","like","use","than",
  "then","time","people","year","way","day","man","woman","life","child",
"world","school","state","group","country","problem","hand","part","place","week",
"system","question","work","number","night","point","home","water","room","mother",
"area","money","story","fact","month","lot","right","study","book","eye",
"job","word","side","kind","head","house","friend","door","city","car",
"face","others","level","education","power","effect","plan","interest","reason",
"art","war","history","party","change","morning","girl","guy","moment","air",
"teacher","force","idea","price","table","court","health","person","office",
"relationship","city","moment",
]);

// confusing / academic words list (extendable)
const confusingWords = new Set([
 "detailed","description","characters","represent","deeper",
 "concept","symbol","technique","allegory","spiritual","moral",
 "physical","unforgettable","brightness","suffering","reinforces"
]);

function analyze(){
  const text = document.getElementById("inputText").value;
  let words = text
    .replace(/[^a-zA-Z\s]/g," ")
    .toLowerCase()
    .split(/\s+/)
    .filter(w => w && !stopWords.has(w));

  let freq = {};
  words.forEach(w => freq[w] = (freq[w] || 0) + 1);

  // Common words: frequency > 1 and not pronoun
  let commonWords = Object.keys(freq)
    .filter(w => freq[w] > 1 && !pronouns.has(w))
    .sort((a,b) => freq[b] - freq[a]);

  // Hard words: single occurrence and confusing or long
  let hardWords = Object.keys(freq)
    .filter(w =>
      freq[w] === 1 &&            // not common
      (confusingWords.has(w) || w.length >= 8)
    );

  let html = "<h3>Common words:</h3>";
  if(commonWords.length === 0){
    html += "<p>None</p>";
  } else {
    commonWords.forEach((w,i)=>{
      html += `<div class="item">${i+1}. ${w} — ${freq[w]}</div>`;
    });
  }

  html += "<h3>Hard spelled words:</h3>";
  if(hardWords.length === 0){
    html += "<p>None</p>";
  } else {
    hardWords.forEach((w,i)=>{
      html += `<div class="item">${i+1}. ${w}</div>`;
    });
  }

  document.getElementById("output").innerHTML = html;
}





</script>
