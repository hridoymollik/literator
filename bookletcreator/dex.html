<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booklet Creator</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <!-- Top Header Bar -->
    <header class="top-header">
        <div class="header-left">
            <div class="app-icon">
                <i class="fas fa-book-open"></i>
            </div>
            <div class="doc-info">
                <input type="text" class="doc-title" value="Untitled Booklet" id="docTitle">
                <div class="menu-bar">
                    <button class="menu-item" id="menuFile">File</button>
                    <button class="menu-item" id="menuEdit">Edit</button>
                    <button class="menu-item" id="menuView">View</button>
                    <button class="menu-item" id="menuInsert">Insert</button>
                    <button class="menu-item" id="menuFormat">Format</button>
                </div>
            </div>
        </div>
        <div class="header-right">
            <button class="btn-booklet-settings" id="btnBookletSettings" title="Booklet Settings">
                <i class="fas fa-cog"></i> Booklet Settings
            </button>
            <button class="btn-print" id="btnPrint" title="Generate Booklet PDF">
                <i class="fas fa-print"></i> Print Booklet
            </button>
        </div>
    </header>

    <!-- Toolbar -->
    <div class="toolbar" id="toolbar">
        <!-- Row 1 -->
        <div class="toolbar-row">
            <div class="toolbar-group">
                <button class="tool-btn" id="btnUndo" title="Undo (Ctrl+Z)">
                    <i class="fas fa-undo"></i>
                </button>
                <button class="tool-btn" id="btnRedo" title="Redo (Ctrl+Y)">
                    <i class="fas fa-redo"></i>
                </button>
                <button class="tool-btn" id="btnPrintPreview" title="Print Preview">
                    <i class="fas fa-eye"></i>
                </button>
            </div>

            <div class="toolbar-divider"></div>

            <div class="toolbar-group">
                <select class="tool-select" id="formatBlock" title="Paragraph style">
                    <option value="p">Normal text</option>
                    <option value="h1">Heading 1</option>
                    <option value="h2">Heading 2</option>
                    <option value="h3">Heading 3</option>
                    <option value="h4">Heading 4</option>
                    <option value="h5">Heading 5</option>
                    <option value="h6">Heading 6</option>
                    <option value="blockquote">Quote</option>
                </select>
            </div>

            <div class="toolbar-divider"></div>

            <div class="toolbar-group">
                <select class="tool-select font-family-select" id="fontFamily" title="Font">
                    <option value="Arial">Arial</option>
                    <option value="Times New Roman">Times New Roman</option>
                    <option value="Georgia">Georgia</option>
                    <option value="Courier New">Courier New</option>
                    <option value="Verdana">Verdana</option>
                    <option value="Trebuchet MS">Trebuchet MS</option>
                    <option value="Comic Sans MS">Comic Sans MS</option>
                    <option value="Impact">Impact</option>
                    <option value="Roboto">Roboto</option>
                </select>
            </div>

            <div class="toolbar-divider"></div>

            <div class="toolbar-group">
                <button class="tool-btn font-size-btn" id="fontSizeDecrease" title="Decrease font size">
                    <i class="fas fa-minus"></i>
                </button>
                <input type="number" class="font-size-input" id="fontSize" value="11" min="1" max="400" title="Font size">
                <button class="tool-btn font-size-btn" id="fontSizeIncrease" title="Increase font size">
                    <i class="fas fa-plus"></i>
                </button>
            </div>

            <div class="toolbar-divider"></div>

            <div class="toolbar-group">
                <button class="tool-btn" id="btnBold" title="Bold (Ctrl+B)">
                    <i class="fas fa-bold"></i>
                </button>
                <button class="tool-btn" id="btnItalic" title="Italic (Ctrl+I)">
                    <i class="fas fa-italic"></i>
                </button>
                <button class="tool-btn" id="btnUnderline" title="Underline (Ctrl+U)">
                    <i class="fas fa-underline"></i>
                </button>
                <button class="tool-btn" id="btnStrikethrough" title="Strikethrough">
                    <i class="fas fa-strikethrough"></i>
                </button>
                <div class="color-picker-wrapper">
                    <button class="tool-btn" id="btnTextColor" title="Text color">
                        <i class="fas fa-font"></i>
                        <div class="color-indicator" id="textColorIndicator" style="background:#000"></div>
                    </button>
                    <input type="color" id="textColorPicker" class="hidden-color-input" value="#000000">
                </div>
                <div class="color-picker-wrapper">
                    <button class="tool-btn" id="btnHighlight" title="Highlight color">
                        <i class="fas fa-highlighter"></i>
                        <div class="color-indicator" id="highlightIndicator" style="background:yellow"></div>
                    </button>
                    <input type="color" id="highlightColorPicker" class="hidden-color-input" value="#ffff00">
                </div>
            </div>

            <div class="toolbar-divider"></div>

            <div class="toolbar-group">
                <button class="tool-btn" id="btnLink" title="Insert link">
                    <i class="fas fa-link"></i>
                </button>
                <button class="tool-btn" id="btnImage" title="Insert image">
                    <i class="fas fa-image"></i>
                </button>
            </div>

            <div class="toolbar-divider"></div>

            <div class="toolbar-group">
                <button class="tool-btn" id="btnAlignLeft" title="Align left">
                    <i class="fas fa-align-left"></i>
                </button>
                <button class="tool-btn" id="btnAlignCenter" title="Align center">
                    <i class="fas fa-align-center"></i>
                </button>
                <button class="tool-btn" id="btnAlignRight" title="Align right">
                    <i class="fas fa-align-right"></i>
                </button>
                <button class="tool-btn" id="btnAlignJustify" title="Justify">
                    <i class="fas fa-align-justify"></i>
                </button>
            </div>

            <div class="toolbar-divider"></div>

            <div class="toolbar-group">
                <select class="tool-select small-select" id="lineSpacing" title="Line spacing">
                    <option value="1">1.0</option>
                    <option value="1.15" selected>1.15</option>
                    <option value="1.5">1.5</option>
                    <option value="2">2.0</option>
                    <option value="2.5">2.5</option>
                    <option value="3">3.0</option>
                </select>
            </div>

            <div class="toolbar-divider"></div>

            <div class="toolbar-group">
                <button class="tool-btn" id="btnBulletList" title="Bulleted list">
                    <i class="fas fa-list-ul"></i>
                </button>
                <button class="tool-btn" id="btnNumberList" title="Numbered list">
                    <i class="fas fa-list-ol"></i>
                </button>
                <button class="tool-btn" id="btnIndentDecrease" title="Decrease indent">
                    <i class="fas fa-outdent"></i>
                </button>
                <button class="tool-btn" id="btnIndentIncrease" title="Increase indent">
                    <i class="fas fa-indent"></i>
                </button>
            </div>

            <div class="toolbar-divider"></div>

            <div class="toolbar-group">
                <button class="tool-btn" id="btnClearFormat" title="Clear formatting">
                    <i class="fas fa-remove-format"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Editor Area -->
    <div class="editor-container" id="editorContainer">
        <div class="ruler-horizontal" id="rulerH"></div>
        <div class="editor-scroll-area">
            <div class="page-wrapper">
                <div class="page" id="editorPage">
                    <div class="editor-content" id="editor" contenteditable="true" spellcheck="true">
                        <p><br></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
        <div class="status-left">
            <span id="wordCount">Words: 0</span>
            <span id="charCount">Characters: 0</span>
        </div>
        <div class="status-right">
            <span id="pageCount">Page 1 of 1</span>
            <span id="zoomLevel">100%</span>
        </div>
    </div>

    <!-- Booklet Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <h2>Booklet Settings</h2>
                <button class="modal-close" id="closeSettings">&times;</button>
            </div>
            <div class="modal-body">
                <div class="setting-group">
                    <label>Content Page Size</label>
                    <p class="setting-description">The size each page of your content will appear as</p>
                    <select id="contentPageSize">
                        <option value="A5" selected>A5 (148 × 210 mm)</option>
                        <option value="A6">A6 (105 × 148 mm)</option>
                        <option value="Half-Letter">Half Letter (139.7 × 215.9 mm)</option>
                        <option value="B6">B6 (125 × 176 mm)</option>
                        <option value="custom">Custom...</option>
                    </select>
                    <div class="custom-size-inputs" id="customContentSize" style="display:none;">
                        <div class="size-input-row">
                            <label>Width (mm):</label>
                            <input type="number" id="customContentW" value="148" min="50" max="300">
                            <label>Height (mm):</label>
                            <input type="number" id="customContentH" value="210" min="50" max="400">
                        </div>
                    </div>
                </div>

                <div class="setting-group">
                    <label>Print Paper Size</label>
                    <p class="setting-description">The physical paper you'll print on</p>
                    <select id="printPaperSize">
                        <option value="A4" selected>A4 (210 × 297 mm)</option>
                        <option value="Letter">Letter (215.9 × 279.4 mm)</option>
                        <option value="A3">A3 (297 × 420 mm)</option>
                        <option value="Legal">Legal (215.9 × 355.6 mm)</option>
                        <option value="Tabloid">Tabloid (279.4 × 431.8 mm)</option>
                        <option value="custom">Custom...</option>
                    </select>
                    <div class="custom-size-inputs" id="customPrintSize" style="display:none;">
                        <div class="size-input-row">
                            <label>Width (mm):</label>
                            <input type="number" id="customPrintW" value="210" min="100" max="500">
                            <label>Height (mm):</label>
                            <input type="number" id="customPrintH" value="297" min="100" max="600">
                        </div>
                    </div>
                </div>

                <div class="setting-group">
                    <label>Print Orientation</label>
                    <div class="orientation-options">
                        <label class="radio-label">
                            <input type="radio" name="orientation" value="landscape" checked>
                            <span class="radio-custom"></span>
                            Landscape (recommended for booklets)
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="orientation" value="portrait">
                            <span class="radio-custom"></span>
                            Portrait
                        </label>
                    </div>
                </div>

                <div class="setting-group">
                    <label>Pages Per Sheet</label>
                    <select id="pagesPerSheet">
                        <option value="2" selected>2 (standard booklet)</option>
                        <option value="4">4 (mini booklet)</option>
                    </select>
                </div>

                <div class="setting-group">
                    <label>Margins (mm)</label>
                    <div class="margin-inputs">
                        <div class="margin-input">
                            <label>Top</label>
                            <input type="number" id="marginTop" value="10" min="0" max="50">
                        </div>
                        <div class="margin-input">
                            <label>Bottom</label>
                            <input type="number" id="marginBottom" value="10" min="0" max="50">
                        </div>
                        <div class="margin-input">
                            <label>Inner</label>
                            <input type="number" id="marginInner" value="15" min="0" max="50">
                        </div>
                        <div class="margin-input">
                            <label>Outer</label>
                            <input type="number" id="marginOuter" value="10" min="0" max="50">
                        </div>
                    </div>
                </div>

                <div class="setting-group">
                    <label>
                        <input type="checkbox" id="showPageNumbers" checked>
                        Show page numbers
                    </label>
                </div>

                <div class="setting-group">
                    <label>
                        <input type="checkbox" id="showCutLines">
                        Show cut/fold lines
                    </label>
                </div>

                <div class="setting-group">
                    <label>
                        <input type="checkbox" id="duplexPrint" checked>
                        Duplex (double-sided) layout
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="resetSettings">Reset to Default</button>
                <button class="btn-primary" id="applySettings">Apply & Close</button>
            </div>
        </div>
    </div>

    <!-- Print Preview Modal -->
    <div class="modal-overlay" id="previewModal">
        <div class="modal modal-large">
            <div class="modal-header">
                <h2>Booklet Preview</h2>
                <div class="preview-controls">
                    <button class="btn-secondary" id="prevPreviewPage" title="Previous page">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <span id="previewPageInfo">Sheet 1 of 1</span>
                    <button class="btn-secondary" id="nextPreviewPage" title="Next page">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
                <button class="modal-close" id="closePreview">&times;</button>
            </div>
            <div class="modal-body preview-body">
                <div class="preview-container" id="previewContainer">
                    <!-- Preview pages rendered here -->
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="cancelPreview">Cancel</button>
                <button class="btn-primary" id="downloadPdf">
                    <i class="fas fa-download"></i> Download Booklet PDF
                </button>
            </div>
        </div>
    </div>

    <!-- File Menu Dropdown -->
    <div class="dropdown-menu" id="fileMenu">
        <button class="dropdown-item" id="menuNew"><i class="fas fa-file"></i> New</button>
        <button class="dropdown-item" id="menuOpen"><i class="fas fa-folder-open"></i> Open</button>
        <button class="dropdown-item" id="menuSave"><i class="fas fa-save"></i> Save (HTML)</button>
        <div class="dropdown-divider"></div>
        <button class="dropdown-item" id="menuPageSetup"><i class="fas fa-cog"></i> Page setup</button>
        <button class="dropdown-item" id="menuPrintBooklet"><i class="fas fa-print"></i> Print as Booklet</button>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner">
            <div class="spinner"></div>
            <p id="loadingText">Generating booklet PDF...</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <p id="progressText">0%</p>
        </div>
    </div>

    <input type="file" id="fileInput" accept=".html,.htm,.txt" style="display:none">
    <input type="file" id="imageInput" accept="image/*" style="display:none">

    <script src="js/editor.js"></script>
    <script src="js/booklet.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
