  </div>  <div class="right">
    <h2>Contact Us</h2><form id="contactForm">
  <div class="form-group">
    <input type="text" name="name" placeholder="Your Name" required>
  </div>

  <div class="form-group">
    <input type="email" name="email" placeholder="Your Email" required>
  </div>

  <div class="form-group">
    <input type="text" name="course" placeholder="Course Interested In">
  </div>

  <div class="form-group">
    <textarea name="message" placeholder="Your Message" required></textarea>
  </div>

  <button type="submit">Send Message by WhatsApp</button>
</form>

<script>
  const form = document.getElementById('contactForm');

  form.addEventListener('submit', function(e){
    e.preventDefault();

    const name = form.name.value.trim();
    const email = form.email.value.trim();
    const course = form.course.value.trim();
    const message = form.message.value.trim();

    if(!name || !email || !message){
      alert('Please fill all required fields');
      return;
    }

    const phoneNumber = "8801575636625"; // নিজের WhatsApp নাম্বার বসাও (country code সহ, + ছাড়া)

    const text = `New Course Inquiry:%0A

Name: ${name}%0A Email: ${email}%0A Course: ${course}%0A Message: ${message}`;

const whatsappURL = `https://wa.me/${phoneNumber}?text=${text}`;

    window.open(whatsappURL, '_blank');

    form.reset();
  });
</script>
